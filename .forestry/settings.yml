---
new_page_extension: md
auto_deploy: false
admin_path: ''
webhook_url: 
sections:
- type: heading
  label: Homepage
- type: document
  path: data/home_slider/list.yaml
  label: Home Slider
- type: document
  path: content/_index.md
  label: Home Page
- type: heading
  label: Primary Sections
- type: directory
  path: content/blog
  label: Blog
  create: all
  match: "**/*"
  exclude: _index.md
  templates:
  - single-page-template
- type: directory
  path: content/product
  label: Plugins / Products
  create: all
  match: "**/*"
  exclude: _index.md
  templates:
  - product
  - single-page-template
- type: heading
  label: Other Sections
- type: directory
  path: content/disclaimer
  label: Disclaimer
  create: all
  match: "**/*"
  templates:
  - simple
- type: heading
  label: Website Meta/Data
- type: directory
  path: content/scripts
  label: Scripts
  create: all
  match: "**/*"
  templates:
  - simple
- type: document
  path: content/info/_index.md
  label: Site Info
- type: heading
  label: Not Editable
- type: document
  path: content/about/_index.md
  label: About
- type: document
  path: content/contact/_index.md
  label: Contact
upload_dir: static/images
public_path: "/images"
front_matter_path: ''
use_front_matter_path: false
file_template: ":filename:"
build:
  preview_env:
  - HUGO_ENV=staging
  - HUGO_VERSION=0.56.3
  preview_output_directory: public
  preview_docker_image: forestryio/hugo:latest
  mount_path: "/srv"
  working_dir: "/srv"
  instant_preview_command: hugo server -D -E -F --port 8080 --bind 0.0.0.0 --renderToDisk
    -d public
version: 0.56.3
