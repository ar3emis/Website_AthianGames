---
label: Home Slider
hide_body: true
fields:
- type: text
  name: title
  label: title
  config:
    required: true
    min: '1'
  description: 'This field is what you would want to recognize this slide in the backend
    as. Eg: Slide 1, Slide about discount, etc'
- type: datetime
  name: date
  label: Publish Date
  default: now
  config:
    required: true
    min: '1'
  description: Select/Enter Date You Created This Post. Does not support scheduling
    posts in a future date.
- type: file
  name: image
  label: image
  config:
    required: true
    maxSize: '5'
  description: Primary Image For Banner
- type: text
  name: buttonlink
  label: buttonlink
  config:
    min: '1'
  description: Where the "Learn More" button links to
- type: textarea
  name: topText
  label: Top Text
  config:
    required: false
    min: '1'
  description: The Text That Appears In Cursive Above The Main Text
- type: textarea
  name: bottomText
  label: Bottom Text
  config:
    required: true
    min: '1'
  description: Primary Banner Text use `<BR>` to add line breaks to your text.
- type: boolean
  name: private
  label: private
  config:
    required: true
    min: '1'
  description: Appears in footer/contact page
  hidden: true
