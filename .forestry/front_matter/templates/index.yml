---
label: Index
hide_body: false
fields:
- type: text
  name: title
  label: title
  config:
    required: true
    min: '1'
  description: Name Of Page/Post
- type: text
  name: topText
  label: topText Title
  config:
    required: true
    min: '1'
  description: Title Text On Banner Image
- type: text
  name: bottomText
  label: bottomText Title
  config:
    required: true
    min: '1'
  description: Explainer Text On Banner Image
- type: datetime
  name: date
  label: Publish Date
  default: now
  config:
    required: true
    min: '1'
  description: Select/Enter Date You Created This Post. Does not support scheduling
    posts in a future date.
  hidden: true
- type: textarea
  name: seotitle
  label: seo title
  config:
    required: false
  description: Title For SEO
- type: textarea
  name: seodescription
  label: seo description
  config:
    required: false
  description: Description For SEO
- type: file
  name: image
  label: image
  config:
    required: true
    maxSize: '5'
  description: Primary Image On Page (Also appears in SEO)