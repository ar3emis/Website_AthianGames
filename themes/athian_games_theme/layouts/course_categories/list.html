{{ define "main" }}

<div class="qrt-half-content-frame column">
    {{ partial "inner-banner.html" . }}
    <div class="qrt-left">
        <div class="row">
            <div class="col-xl-8 offset-xl-2 col-lg-12">
                <div class="row">
                    <div class="col-lg-12">
                        {{partial "theme-files/content-design" .}}
                        <div class="">
                            {{ range .Data.Pages.ByDate.Reverse }}
                            <div class="courses-list-wrapper">
                                <div class="course-wrapper">
                                    <img class="course-list-image" src="{{.Params.mainImage}}" alt="{{.Title}}" />
                                    <div class="course-text">
                                      <h3 class="course-title">{{.Title}}</h3>
                                      <p class="course-short-description">{{.Params.shortDescription}}</p>
                                     
                                      <a class="qrt-anima-link course-learn-more" href="{{ .Permalink }}">Learn more &rightarrow;</a>
                                    </div>
                                  </div>
                            </div>
                            {{ end }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



{{ end }}
