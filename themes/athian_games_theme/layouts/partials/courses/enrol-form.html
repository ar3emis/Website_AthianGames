<div class="contact-wrapper">
  <h2 class="contact-title">{{.Params.enrolTitle}}</h2>
  <form action="mailto:{{ .Params.mailto }}" method="get" class="contact-form" onsubmit="submitted=true">
    <div class="contact-row">
      <label class="contact-label">Name</label>
      <input type="text" placeholder="Name" class="contact-input" required>
    </div>
  
    <div class="contact-row">
      <label class="contact-label">Email</label>
      <input type="email" placeholder="Email Address" class="contact-input" required>
    </div>

    <button class="qrt-btn qrt-btn-color contact-button" type="submit">Apply</button>
  </form>
</div>
