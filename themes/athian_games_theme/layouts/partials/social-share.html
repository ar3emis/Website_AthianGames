{{ $url := printf "%s" .Permalink | absLangURL }}
<div class="blog-share mb-30 text-center">
    <a class="btn__social btn btn__facebook" title="Facebook" href="//facebook.com/sharer/sharer.php?u={{ $url }}" target="_blank" rel="noopener" aria-label="">
        <i class="fab fa-facebook"></i>
    </a>

    <a class="btn__social btn btn__android" title="whatsapp" href="//api.whatsapp.com/send?text={{ .Title | htmlEscape }}%20{{ $url }}" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <a class="btn__social btn btn__twitter" title="twitter" href="//twitter.com/intent/tweet/?text={{ .Title | htmlEscape }}&amp;url={{ $url }}" target="_blank" rel="noopener" aria-label="">
        <i class="fab fa-twitter"></i>
    </a>

    <a class="btn__social btn btn__telegram" title="telegram" href="//telegram.me/share/msg?text={{ .Title | htmlEscape }}&amp;url={{ $url }}" target="_blank" rel="noopener" aria-label="">
        <i class="fa fa-paper-plane"></i>
    </a>


    <a class="btn__social btn btn__pinterest" title="pinterest" href="//pinterest.com/pin/create/button/?url={{ $url}}&description={{ .Title | htmlEscape }}"  target="_blank" rel="noopener" >
        <i class="fab fa-pinterest"></i>
    </a>

    <a class="btn__social btn btn__reddit" title="reddit" href="//reddit.com/submit/?url={{ $url }}&amp;resubmit=true&amp;title={{ .Title | htmlEscape }}" target="_blank" rel="noopener" aria-label=""> 
    <i class="fab fa-reddit"></i>
    </a>

    <a class="btn__social btn btn__email" title="email" href="mailto:?subject={{ .Title | htmlEscape }}&amp;body={{ $url }}" target="_self" rel="noopener" target="_blank" rel="noopener" aria-label=""> 
        <i class="fa fa-envelope"></i>
        </a>
    

</div>
