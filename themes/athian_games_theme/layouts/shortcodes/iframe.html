{{ with .Get "title" }}<h3 class="mb-10 mt-10">{{ . }}</h3>{{ end }}
{{ with .Get "caption" }}<span style="font-weight: lighter;font-size: 20px;margin: 10px 0px 20px 0px;letter-spacing: 2px;">{{ . }}</span>{{ end }}
{{ with .Get "url" }}
<iframe data-src="{{ . }}" class="mt-20 lozad" width="100%" height="500px" frameborder="0" marginheight="0" marginwidth="0" lazyload="True"></iframe>
{{ end }}
