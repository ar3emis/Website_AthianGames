{{- if not ($.Page.Scratch.Get "counter") }}
{{$.Page.Scratch.Set "counter" 0}}
{{ end }}

{{- $.Page.Scratch.Add "counter" 1 }}

<div class="faq-item mb-20">
    <button type="button" class="btn btn-info" data-toggle="collapse" data-target="#{{($.Page.Scratch.Get "counter")}}"><i class="fa fa-minus" aria-hidden="true"></i></button>
    <p class="question">Day {{($.Page.Scratch.Get "counter")}}: {{ with .Get "heading" }}{{ . }}{{end}}</p>
    <div id="{{($.Page.Scratch.Get "counter")}}" class="collapse {{if eq ($.Page.Scratch.Get "counter") 1}}in {{end}}faq-para">
        {{if .Inner}}{{ partial "theme-files/inner" . }}{{end}}
    </div>
</div>
