                <div class="row">
                    <!-- <div class="qrt-grid-sizer"></div> -->
                    {{ $paginator := .Paginate .Data.Pages }}


                    {{ range ($paginator.Pages.ByDate.Reverse) }}
                    <div class="col-md-6 col-lg-4 col-xl-3 mb-20 {{range .Params.plugin_categories}}{{. | urlize}}{{end}}">
                        <div class="qrt-work-item"><a href="{{.Permalink}}" class="qrt-cursor-scale qrt-work-cover-frame qrt-anima-link">
                            {{if .Params.image}}
                            <img src="{{.Params.image | absURL}}" alt="Plugin Banner">
                            {{end}}
                            <!-- <div class="qrt-item-zoom qrt-cursor-color"><i class="fas fa-external-link"></i>
                            
                            </div> -->
                            <div class="qrt-work-category">    {{range .Params.plugin_categories}}
                                <span onclick="window.open('/plugin_categories/{{. | urlize}}','self')">{{.}}</span>
                                {{end}}
                            </div>


                          </a>
                          <div class="qrt-work-descr">
                            <h4 class="qrt-cursor-color qrt-white"><a href="{{.Permalink}}" class="qrt-anima-link">{{.Title}}</a></h4><a href="{{.Permalink}}" class="qrt-cursor-scale qrt-work-more qrt-anima-link"><i class="fas fa-arrow-right"></i></a>
                          </div>
                        </div>
                      </div>  
                    {{ end }}
                </div>
           
    


   
    <div class="col-lg-12">

        {{partial "functionality/pagination" .}}

<div class="qrt-divider qrt-space-fix-2"></div>
