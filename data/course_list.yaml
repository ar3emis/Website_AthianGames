courseDescriptions:
  Unreal Crash Courses: >-
    A comprehensive guide to the key features of Unreal Engine. From asset
    creation to blueprint scripting, this course lays the groundwork for your
    projects.
  Game Development: >-
    Create immersive games using Unreal Engine. Covering all aspects of
    development from concept to publishing, turn your game ideas into reality.
  Unreal C++: >-
    Enhance your game development skills by learning to code in Unreal Engine's
    powerful C++ language. Dive into custom mechanics, AI behaviors, and more.
  VFX: >-
    Discover and apply Unreal Engine's visual effects. Master particle systems,
    material creation, and post-processing effects with hands-on projects.
