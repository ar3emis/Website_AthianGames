List:
  - topText: Unreal Engine Training
    imageText: /images/athr-image.png
    bottomText: >-
      We are immensely privileged to be recognized as an Unreal Authorized
      Training Center (UATC). Our objective as a UATC is to provide exemplary,
      industry-standard training in game development and real-time graphics. Our
      target audience encompasses both studios taking the momentous leap toward
      integrating Unreal Engine into their workflow, and ambitious individuals
      who are eager to acquire knowledge and expertise in game creation.
    bannerImage: /images/aboutmecover.jpg
    button:
      - buttonText: Learn More
        buttonLink: /courses
    showreel:
      - {}
  - topText: ' Make Awesome Gameplay'
